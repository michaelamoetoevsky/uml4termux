# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: kernel-build

# =============================================================================
# Build the UML arm64 kernel ourselves (bionic target).
#
#   WHY: the released kernels are downstream builds with verified gaps
#   (no CONFIG_CPUSETS, no cgroup io.max, tmpfs/page-cache not charged).
#   This workflow builds Raymer's packaging fork (whose tree matches the
#   config this project extracted from the running guest) with the
#   gap-closing symbols enabled, producing a bionic binary that runs
#   natively in Termux.
#
#   WHY ubuntu-24.04-arm: UML is a process OF ITS HOST, so the kernel must
#   be built on (and for) aarch64.  Public repositories get GitHub's arm64
#   runners for free; private repos would need a paid plan or a self-hosted
#   runner (the phone itself).
#
#   NOTES from the first two runs:
#   * zalexdev's branch HEAD does not compile (sched/signal.h -> user_mode)
#   * zalexdev's prebuilt-20260816 commitish lacks UML_SUBARCH_SUPPORTS_SMP,
#     so SMP (and everything depending on it, e.g. CPUSETS) is dropped by
#     olddefconfig.  Raymer's packaging fork carries the working wiring.
#   * The base config (cfg-smp.txt) goes to $OUT/.config, never to the
#     source tree: an out-of-tree build refuses a dirty srctree.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      # C4: set to test a different source (e.g. zalexdev HEAD) without
      # touching the default release path.  Empty = the pinned Raymer commit.
      ksrc_ref:
        description: 'git ref to build (empty = pinned release commit)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'ci/kernel/**'
      - '.github/workflows/kernel-build.yml'

permissions:
  contents: read

env:
  KSRC: https://github.com/Raymer8639/linux-um-arm64
  # C5b: pin every clock/identity input the kernel embeds in its version
  # string.  Without these the kernel hash changes on every build (the only
  # reason the v0.4.0 CI kernel differs from v0.3.0's).  With them, two
  # builds from the same pinned commit are byte-identical.
  KBUILD_BUILD_TIMESTAMP: "Thu Oct 23 23:21:58 UTC 2026"
  KBUILD_BUILD_USER: uml4termux
  KBUILD_BUILD_HOST: pinned-source

jobs:
  bionic:
    # x86_64 runner: the official NDK only ships linux-x86_64 host tools, and
    # this is a CROSS-compile -- the build never executes the aarch64-bionic
    # output.  (An arm64 runner cannot run the x86_64 NDK clang: "clang: 1:
    # Syntax error" from sh trying to interpret the ELF.)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout uml4termux (config + scripts)
        uses: actions/checkout@v4

      - name: Clone Raymer's packaging fork (pinned to the released commit)
        run: |
          # The pin is not arbitrary: the released linux-bionic's uname -r is
          # 7.2.0-rc4-g169b17ff3f66-dirty, i.e. this exact commit produced the
          # device-validated kernel. Pinning keeps every future build
          # traceable to the same source.  C4: workflow_dispatch can override
          # the ref (inputs.ksrc_ref) to trial e.g. zalexdev HEAD; the default
          # stays the pinned Raymer release commit.
          KERNEL_COMMIT="169b17ff3f66d507cb137b770ceb1fd9f4547a32"
          if [ -n "${{ github.event.inputs.ksrc_ref }}" ]; then
            KERNEL_COMMIT="${{ github.event.inputs.ksrc_ref }}"
            echo "C4 trial ref: $KERNEL_COMMIT"
          fi
          git clone --filter=blob:none --no-single-branch "$KSRC" "$RUNNER_TEMP/ksrc"
          git -C "$RUNNER_TEMP/ksrc" checkout "$KERNEL_COMMIT"
          git -C "$RUNNER_TEMP/ksrc" log --oneline -1

      - name: Base config + gap-closing symbols ($OUT/.config)
        working-directory: ${{ runner.temp }}/ksrc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp "$GITHUB_WORKSPACE/ci/kernel/cfg-smp.txt" "$RUNNER_TEMP/out/.config"
          scripts/config --file "$RUNNER_TEMP/out/.config" \
            -e CONFIG_CPUSETS -e CONFIG_BLK_CGROUP \
            -e CONFIG_BLK_DEV_THROTTLING -e CONFIG_MODULES \
            -e CONFIG_STATIC_LINK -e CONFIG_UML_NET_VECTOR \
            -e CONFIG_NET_9P -e CONFIG_9P_FS

      - name: Install the NDK (r29 = the released harness's toolchain)
        run: |
          # Toolchain parity matters for the stub: the CI stub built with
          # r27c lacked .rela.dyn and its codegen differs (156 disasm lines)
          # from the released stub_exe, and a guest process SIGSEGVs on the
          # first exec when the r27c stub is used with the CI kernel.  The
          # released binaries were built with NDK 29.0.14206865, so build
          # with exactly that toolchain.
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP/ndk"
          echo "NDK=$RUNNER_TEMP/ndk/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: olddefconfig (kconfig-only stage, host gcc)
        working-directory: ${{ runner.temp }}/ksrc
        run: |
          # scripts/cc-version.sh cannot parse the NDK clang's Android version
          # string ("Android (...based on clang r...) clang version ..."), so
          # the kconfig stage runs with the host gcc.  The options we need
          # (CPUSETS, BLK_CGROUP, THROTTLING, MODULES) are compiler-
          # independent; the build below uses the NDK clang.
          make ARCH=um SUBARCH=arm64 O="$RUNNER_TEMP/out" \
            HOSTCC=gcc HOSTCXX=g++ CC=gcc \
            olddefconfig
          for s in CPUSETS BLK_CGROUP BLK_DEV_THROTTLING MODULES SMP; do
            grep -E "^CONFIG_${s}=" "$RUNNER_TEMP/out/.config" \
              || { echo "symbol $s missing after olddefconfig"; exit 1; }
          done

      - name: Make the kconfig version checks NDK-tolerant
        working-directory: ${{ runner.temp }}/ksrc
        run: |
          # scripts/cc-version.sh (and its as/ld siblings) parse `$CC --version`
          # with regexes that miss the NDK clang's "Android (...) based on
          # clang r... clang version 18.0.3" string, which kills every
          # kconfig invocation (olddefconfig AND implicit syncconfig).
          # Replace them with stubs reporting clang 18: the kconfig gates only
          # need a parseable name+version; the real compile flags are passed
          # explicitly below.  CI-only: the stubs live in the runner clone.
          for f in scripts/cc-version.sh scripts/as-version.sh scripts/ld-version.sh; do
            if [ -f "$f" ]; then
              printf '#!/bin/sh\necho clang 18 0 3\n' > "$f"
              chmod +x "$f"
            fi
          done

      - name: syncconfig (kconfig-only stage, host gcc)
        working-directory: ${{ runner.temp }}/ksrc
        run: |
          # The build's implicit syncconfig would re-run the kconfig CC check
          # with the NDK clang (which scripts/cc-version.sh cannot parse), so
          # regenerate include/config/auto.conf here with the host gcc: the
          # build then sees it as up to date and never invokes kconfig again.
          make ARCH=um SUBARCH=arm64 O="$RUNNER_TEMP/out" \
            HOSTCC=gcc HOSTCXX=g++ CC=gcc \
            syncconfig

      - name: Build (bionic)
        working-directory: ${{ runner.temp }}/ksrc
        run: |
          set -euo pipefail
          make ARCH=um SUBARCH=arm64 O="$RUNNER_TEMP/out" \
            HOSTCC=gcc HOSTCXX=g++ \
            CC="$NDK/bin/clang --target=aarch64-linux-android30" \
            LD="$NDK/bin/ld.lld" AR="$NDK/bin/llvm-ar" NM="$NDK/bin/llvm-nm" \
            OBJCOPY="$NDK/bin/llvm-objcopy" OBJDUMP="$NDK/bin/llvm-objdump" \
            READELF="$NDK/bin/llvm-readelf" STRIP="$NDK/bin/llvm-strip" \
            LLVM_IAS=1 CLANG_TARGET_FLAGS=aarch64-linux-android30 \
            -j"$(nproc)" 2>&1 | tee build.log
          test -f "$RUNNER_TEMP/out/linux"

      - name: Build the uml4termuxd daemon (bionic, from the repo's src/)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          "$NDK/bin/clang" -O2 -Wall -Wextra -Werror \
            --target=aarch64-linux-android30 \
            -o "$RUNNER_TEMP/artifacts/uml4termuxd" src/uml4termuxd.c
          file "$RUNNER_TEMP/artifacts/uml4termuxd"

      - name: Collect artifacts
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p artifacts
          if [ -f out/linux ]; then
            cp out/linux artifacts/linux-bionic
            "$NDK/bin/llvm-strip" --strip-debug artifacts/linux-bionic || true
          fi
          STUB="$RUNNER_TEMP/out/arch/um/kernel/skas/stub_exe"
          if [ -f "$STUB" ]; then
            cp "$STUB" artifacts/stub_exe
          else
            echo "WARNING: stub_exe not at the pinned path" >&2
            find "$RUNNER_TEMP/out" ksrc -name stub_exe -type f 2>/dev/null | head -1 \
              | { read -r f; [ -n "$f" ] && cp "$f" artifacts/stub_exe; }
          fi
          cp ksrc/build.log artifacts/ 2>/dev/null || true
          (cd artifacts && sha256sum * > SHA256SUMS || true)
          ls -la artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uml4termux-kernel-bionic
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
