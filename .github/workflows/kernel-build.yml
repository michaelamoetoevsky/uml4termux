# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: kernel-build

# =============================================================================
# Build the UML arm64 kernel ourselves (bionic target).
#
#   WHY: the released kernels are downstream builds with verified gaps
#   (no CONFIG_CPUSETS, no cgroup io.max, tmpfs/page-cache not charged).
#   This workflow builds Raymer's packaging fork (whose tree matches the
#   config this project extracted from the running guest) with the
#   gap-closing symbols enabled, producing a bionic binary that runs
#   natively in Termux.
#
#   WHY ubuntu-24.04-arm: UML is a process OF ITS HOST, so the kernel must
#   be built on (and for) aarch64.  Public repositories get GitHub's arm64
#   runners for free; private repos would need a paid plan or a self-hosted
#   runner (the phone itself).
#
#   NOTES from the first two runs:
#   * zalexdev's branch HEAD does not compile (sched/signal.h -> user_mode)
#   * zalexdev's prebuilt-20260816 commitish lacks UML_SUBARCH_SUPPORTS_SMP,
#     so SMP (and everything depending on it, e.g. CPUSETS) is dropped by
#     olddefconfig.  Raymer's packaging fork carries the working wiring.
#   * The base config (cfg-smp.txt) goes to $OUT/.config, never to the
#     source tree: an out-of-tree build refuses a dirty srctree.
# =============================================================================

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/kernel/**'
      - '.github/workflows/kernel-build.yml'

permissions:
  contents: read

env:
  KSRC: https://github.com/Raymer8639/linux-um-arm64

jobs:
  bionic:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Checkout uml4termux (config + scripts)
        uses: actions/checkout@v4

      - name: Clone Raymer's packaging fork (matches cfg-smp.txt)
        run: |
          git clone --depth 1 "$KSRC" "$RUNNER_TEMP/ksrc"
          git -C "$RUNNER_TEMP/ksrc" log --oneline -1

      - name: Base config + gap-closing symbols ($OUT/.config)
        working-directory: ${{ runner.temp }}/ksrc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp "$GITHUB_WORKSPACE/ci/kernel/cfg-smp.txt" "$RUNNER_TEMP/out/.config"
          scripts/config --file "$RUNNER_TEMP/out/.config" \
            -e CONFIG_CPUSETS -e CONFIG_BLK_CGROUP \
            -e CONFIG_BLK_DEV_THROTTLING -e CONFIG_MODULES \
            -e CONFIG_STATIC_LINK -e CONFIG_UML_NET_VECTOR \
            -e CONFIG_NET_9P -e CONFIG_9P_FS

      - name: Install the NDK (r27c, linux-x86_64 tools, bionic sysroot)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP/ndk"
          echo "NDK=$RUNNER_TEMP/ndk/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: olddefconfig (kconfig-only stage, host gcc)
        working-directory: ${{ runner.temp }}/ksrc
        run: |
          # scripts/cc-version.sh cannot parse the NDK clang's Android version
          # string ("Android (...based on clang r...) clang version ..."), so
          # the kconfig stage runs with the host gcc.  The options we need
          # (CPUSETS, BLK_CGROUP, THROTTLING, MODULES) are compiler-
          # independent; the build below uses the NDK clang.
          make ARCH=um SUBARCH=arm64 O="$RUNNER_TEMP/out" \
            HOSTCC=gcc HOSTCXX=g++ CC=gcc \
            olddefconfig
          for s in CPUSETS BLK_CGROUP BLK_DEV_THROTTLING MODULES SMP; do
            grep -E "^CONFIG_${s}=" "$RUNNER_TEMP/out/.config" \
              || { echo "symbol $s missing after olddefconfig"; exit 1; }
          done

      - name: syncconfig (kconfig-only stage, host gcc)
        working-directory: ${{ runner.temp }}/ksrc
        run: |
          # The build's implicit syncconfig would re-run the kconfig CC check
          # with the NDK clang (which scripts/cc-version.sh cannot parse), so
          # regenerate include/config/auto.conf here with the host gcc: the
          # build then sees it as up to date and never invokes kconfig again.
          make ARCH=um SUBARCH=arm64 O="$RUNNER_TEMP/out" \
            HOSTCC=gcc HOSTCXX=g++ CC=gcc \
            syncconfig

      - name: Build (bionic)
        working-directory: ${{ runner.temp }}/ksrc
        run: |
          set -euo pipefail
          make ARCH=um SUBARCH=arm64 O="$RUNNER_TEMP/out" \
            HOSTCC=gcc HOSTCXX=g++ \
            CC="$NDK/bin/clang --target=aarch64-linux-android30" \
            LD="$NDK/bin/ld.lld" AR="$NDK/bin/llvm-ar" NM="$NDK/bin/llvm-nm" \
            OBJCOPY="$NDK/bin/llvm-objcopy" OBJDUMP="$NDK/bin/llvm-objdump" \
            READELF="$NDK/bin/llvm-readelf" STRIP="$NDK/bin/llvm-strip" \
            LLVM_IAS=1 CLANG_TARGET_FLAGS=aarch64-linux-android30 \
            -j"$(nproc)" 2>&1 | tee build.log
          test -f "$RUNNER_TEMP/out/linux"

      - name: Collect artifacts
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p artifacts
          if [ -f out/linux ]; then
            cp out/linux artifacts/linux-bionic
            "$NDK/bin/llvm-strip" --strip-debug artifacts/linux-bionic || true
          fi
          STUB=$(find "$RUNNER_TEMP/out" ksrc -name stub_exe -type f 2>/dev/null | head -1)
          [ -n "$STUB" ] && cp "$STUB" artifacts/stub_exe
          cp ksrc/build.log artifacts/ 2>/dev/null || true
          (cd artifacts && sha256sum * > SHA256SUMS || true)
          ls -la artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uml4termux-kernel-bionic
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
